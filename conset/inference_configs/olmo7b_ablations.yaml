model_name: allenai/Olmo-3-1025-7B
epoch: 1
gen_config_name: beam
batch_size: 32
seeds: &seeds [17, 18, 19]
datasets:
  - {dataset: triviaqa, beg: 5000, end: 9961}
  - {dataset: jeopardy, beg: 15000, end: 20000}
eval_revisions: &oracle [stage1-step566000, stage1-step707000, stage1-step1272000, stage1-step1413814]
adapters:
  - {train_config: lora_triviaqa_acc_lr2e-4_bs16_5k_ncand2_onedata, datasets: [triviaqa], revisions: *oracle, seeds: *seeds}
  - {train_config: lora_triviaqa_acc_lr2e-4_bs16_5k_ncand2_pooldata, datasets: [triviaqa], revisions: *oracle, seeds: *seeds, use_ckpt_respective_predictor: true}
  - {train_config: lora_jeopardy_acc_lr2e-4_bs16_5k_ncand2_onedata, datasets: [jeopardy], revisions: *oracle, seeds: *seeds}
  - {train_config: lora_jeopardy_acc_lr2e-4_bs16_5k_ncand2_pooldata, datasets: [jeopardy], revisions: *oracle, seeds: *seeds, use_ckpt_respective_predictor: true}
